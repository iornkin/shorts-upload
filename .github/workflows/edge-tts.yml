name: edge-tts
on:
  push:
    branches: [claude/jolly-turing-gbjbsb]
    paths: [tts/request.json]
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: edge-tts
jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q edge-tts
      - run: python3 .github/edge_tts_job.py
      - name: commit voice files
        run: |
          git config user.name "edge-tts bot"
          git config user.email "actions@users.noreply.github.com"
          git add tts/out
          git commit -qm "edge-tts 음성: $(python3 -c 'import json;print(json.load(open("tts/request.json"))["id"])')"
          git push
